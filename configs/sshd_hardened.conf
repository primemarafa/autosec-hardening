# ==============================================================================
# AutoSec-Hardener : Configuration OpenSSH Server Durcie (ANSSI / CIS Benchmark)
# Fichier cible : /etc/ssh/sshd_config.d/99-hardened.conf ou /etc/ssh/sshd_config
# ==============================================================================

# Port d'écoute (Par défaut 22, personnalisable)
Port 22

# Protocole SSH version 2 uniquement
# (SSH v1 est obsolète et vulnérable)

# Désactiver la connexion directe avec le compte root
PermitRootLogin no

# Forcer l'authentification par clé publique
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no

# Limiter le nombre de tentatives d'authentification par connexion (Anti Brute-Force)
MaxAuthTries 3
MaxSessions 4

# Déconnexion automatique en cas d'inactivité (ClientAliveInterval x ClientAliveCountMax = 300s = 5 min)
ClientAliveInterval 300
ClientAliveCountMax 0

# Désactiver les fonctionnalités inutiles réduisant la surface d'attaque
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
GatewayPorts no
PermitUserEnvironment no

# Chiffrements forts et modernes recommandés par l'ANSSI
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Journalisation détaillée des connexions et tentatives
LogLevel VERBOSE
SyslogFacility AUTH

# Bannière légale d'avertissement
Banner /etc/issue.net
