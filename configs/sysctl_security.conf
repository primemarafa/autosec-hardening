# ==============================================================================
# AutoSec-Hardener : Configuration Sysctl Durcie (Niveau ANSSI / CIS Benchmark)
# Fichier cible : /etc/sysctl.d/99-security-hardening.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Protection Réseau & Anti-Spoofing (IPv4)
# ------------------------------------------------------------------------------

# Activer la protection contre l'usurpation d'adresse IP (Reverse Path Filtering)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignorer les paquets ICMP broadcast (Protection contre les attaques Smurf DoS)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignorer les faux messages d'erreurs ICMP
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Refuser les redirections ICMP (Empêche les attaques Man-in-the-Middle)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Refuser le routage source (Empêche l'attaquant de spécifier le chemin réseau)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Enregistrer les paquets avec des adresses impossibles (Martians logs)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Activer les SYN Cookies (Protection majeure contre les attaques SYN Flood)
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 5

# ------------------------------------------------------------------------------
# 2. Protection Réseau IPv6 (Si non utilisé ou à restreindre)
# ------------------------------------------------------------------------------
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# ------------------------------------------------------------------------------
# 3. Sécurité Mémoire & Noyau (Kernel Self-Protection)
# ------------------------------------------------------------------------------

# Randomisation de l'espace d'adressage (ASLR - niveau 2 max)
kernel.randomize_va_space = 2

# Restreindre l'accès au buffer d'historique du noyau (dmesg) aux utilisateurs root
kernel.dmesg_restrict = 1

# Masquer les pointeurs mémoire du noyau dans /proc/kallsyms
kernel.kptr_restrict = 2

# Bloquer l'exécution de code ptrace non autorisé (anti-débogage / injection)
kernel.yama.ptrace_scope = 2

# Restreindre l'utilisation des événements de profiling du noyau
kernel.perf_event_paranoid = 3

# Protection contre l'exploitation des liens symboliques et hardlinks dans /tmp
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
